name: Cortera
description: >-
  Cortera was a business (trade) credit data provider that turned anonymized,
  contributed accounts-receivable and B2B payment data into forward-looking
  payment-risk insight, credit scores, and firmographics on private companies
  so credit teams could spot changes in a customer's financial health. Founded
  in Massachusetts, Cortera was acquired by Moody's (Moody's Analytics) in 2021
  and its product line has since been folded into Moody's Company Reference Data
  / Trade Credit offering, marketed as "Moody's Pulse (formerly Cortera)". The
  standalone cortera.com domain now 301-redirects to Moody's; there is no
  independent Cortera developer portal or public self-serve API today — data is
  delivered through Moody's data-delivery APIs, CRM/ERP connectors, and file
  feeds. This profile was surfaced as a Battery Ventures portfolio company and
  is retained as an acquired-company record.
